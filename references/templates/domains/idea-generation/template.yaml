template_name: idea_generation_phase_stage_template
version: 1.0.0
type: guidetree_domain_template
domain: research_idea_generation

description: >
  Domain-specific phase/stage decomposition template for research idea
  generation projects. This template defines how an agent should divide idea
  generation work into phases and stages. It is not an executable skill. It is a
  planning reference used by GuideTree skills when generating, validating, or
  repairing project structures for research ideation.

intended_use:
  used_by:
    - generate_phase_skeleton
    - validate_phase_skeleton
    - expand_phase_to_stage_dag
    - validate_stage_dag
    - expand_stage_to_steps
    - validate_steps

  not_used_as:
    - executable_skill
    - runtime_orchestrator
    - state_update_mechanism
    - direct_project_executor

core_principle: >
  Research idea generation must be decomposed around literature grounding,
  structured brainstorming, Socratic sharpening, honest novelty verification,
  and actionable roadmapping. Ideas without evidence, novelty without
  verification, and plans without gates are all invalid.

domain_scope:
  includes:
    - research idea discovery and brainstorming
    - literature gap identification
    - research question formulation
    - hypothesis sharpening and design
    - novelty checking against prior art
    - cross-model novelty verification
    - feasibility validation (pilot experiments, probes)
    - research roadmap creation
    - go/no-go gate design
    - fallback chain construction
    - robotics and embodied-AI idea discovery
    - exploratory research ideation
    - targeted idea validation
    - interdisciplinary idea synthesis

  excludes_by_default:
    - full experiment execution
    - paper writing and manuscript preparation
    - code implementation beyond pilot probes
    - production system deployment
    - large-scale data collection
    - IRB approval and human-subjects process
    - grant writing and proposal submission
    - commercial product development

  note: >
    Excluded items may be added only if explicitly included in project_context.
